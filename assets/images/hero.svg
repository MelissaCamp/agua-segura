<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="Torneira pingando uma gota em um copo de água limpa, ao lado de folhas verdes" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .drop{animation:fall 2.6s ease-in infinite}
    .ripple{transform-box:fill-box;transform-origin:center;animation:rip 2.6s ease-out infinite}
