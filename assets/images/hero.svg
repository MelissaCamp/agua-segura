    @keyframes fall{0%{transform:translateY(0);opacity:0}10%{opacity:1}68%{transform:translateY(138px);opacity:1}69%,100%{transform:translateY(138px);opacity:0}}
    @keyframes rip{0%,68%{transform:scale(0);opacity:0}70%{transform:scale(.15);opacity:.95}100%{transform:scale(1);opacity:0}}
    @media (prefers-reduced-motion:reduce){.drop,.ripple{animation:none}.ripple{opacity:.5}}
  </style>
